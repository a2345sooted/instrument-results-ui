<div class="page">
  <div class="title-row">
    <h1>Runs</h1>

    <mat-form-field appearance="outline" class="filter">
      <mat-label>Filter</mat-label>
      <input
        matInput
        (keyup)="applyFilter($any($event.target).value)"
        placeholder="Search…"
        aria-label="Filter runs"
      />
    </mat-form-field>
  </div>

  <div class="table-wrap mat-elevation-z1">
    <div class="table-scroll">
      <table mat-table [dataSource]="dataSource" matSort class="runs-table">
        <!-- Run ID -->
        <ng-container matColumnDef="runId">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Run ID</th>
          <td mat-cell *matCellDef="let row">{{ row.runId }}</td>
        </ng-container>

        <!-- Client ID -->
        <ng-container matColumnDef="clientId">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Client ID</th>
          <td mat-cell *matCellDef="let row">{{ row.clientId }}</td>
        </ng-container>

        <!-- External Ref ID -->
        <ng-container matColumnDef="externalRefId">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>External Ref ID</th>
          <td mat-cell *matCellDef="let row">
            {{ row.externalRefId || '—' }}
          </td>
        </ng-container>

        <!-- Status -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
          <td mat-cell *matCellDef="let row">{{ row.status }}</td>
        </ng-container>

        <!-- Created -->
        <ng-container matColumnDef="createdAt">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Created</th>
          <td mat-cell *matCellDef="let row">
            {{ row.createdAt | date: 'yyyy-MM-dd HH:mm' }}
          </td>
        </ng-container>

        <!-- Updated -->
        <ng-container matColumnDef="updatedAt">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Updated</th>
          <td mat-cell *matCellDef="let row">
            {{ row.updatedAt | date: 'yyyy-MM-dd HH:mm' }}
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>

    <mat-paginator
      [pageSize]="10"
      [pageSizeOptions]="[5, 10, 25]"
      showFirstLastButtons
    ></mat-paginator>
  </div>
</div>
