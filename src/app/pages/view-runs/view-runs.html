<div class="page">
  <div class="title-row">
    <h1>Runs</h1>
  </div>

  @if (isLoading) {
    <div class="loading-state">
      <mat-spinner diameter="40"></mat-spinner>
    </div>
  } @else if (loadError) {
    <div class="error-state">
      <p>{{ loadError }}</p>
    </div>
  } @else {
    <div class="table-wrap mat-elevation-z1">
      <div class="table-scroll">
        <table mat-table [dataSource]="dataSource" matSort class="runs-table">
          <!-- Actions -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let row">
              <button mat-button color="primary" (click)="onViewRun(row.id)">
                View
              </button>
            </td>
          </ng-container>

          <!-- ID -->
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
            <td mat-cell *matCellDef="let row">{{ row.id }}</td>
          </ng-container>

          <!-- External Reference -->
          <ng-container matColumnDef="externalReference">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>External Reference</th>
            <td mat-cell *matCellDef="let row">
              {{ row.externalReference || '—' }}
            </td>
          </ng-container>

          <!-- Status -->
          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
            <td mat-cell *matCellDef="let row">{{ row.status }}</td>
          </ng-container>

          <!-- Created -->
          <ng-container matColumnDef="createdAt">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Created</th>
            <td mat-cell *matCellDef="let row">
              {{ row.createdAt | date: 'yyyy-MM-dd HH:mm' }}
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
      </div>
    </div>
  }
</div>
