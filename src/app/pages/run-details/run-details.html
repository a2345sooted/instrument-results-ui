<div class="page">
  @if (isLoadingRun) {
    <div class="state-row" role="status" aria-live="polite">
      <mat-spinner diameter="40"></mat-spinner>
    </div>
  } @else if (runLoadError) {
    <div class="state-row" role="alert">
      <div class="error-state">
        <div class="error-text">
          <div class="title">Unable to load run</div>
          <div class="message">{{ runLoadError }}</div>
        </div>
      </div>
    </div>
  } @else if (run) {
    <div class="layout">
      <!-- Left column (1/3) -->
      <section class="panel">
        <app-run-configuration [run]="run"></app-run-configuration>
      </section>

      <!-- Right column (2/3) -->
      <section class="panel">
        <app-run-summary></app-run-summary>
      </section>
    </div>
  }
</div>
