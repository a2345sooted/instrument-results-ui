<div class="config">
  <div class="header">
    <div class="main-info">
      <h2>Run ID: <span class="mono">{{ run.id }}</span></h2>
      <div class="field">
        <div class="label">External Ref ID</div>
        <div class="value">{{ run.externalReference ?? 'None' }}</div>
      </div>
      <div class="field">
        <div class="label">Instrument Name</div>
        <div class="value">{{ run.instrumentName }}</div>
      </div>
    </div>
    <div class="header-actions">
      <button mat-button (click)="openMoreInfoDialog()">More Info</button>
    </div>
  </div>

  <div class="section">
    <h3 class="section-title">Measurements</h3>

    @if (run.measurementsSubmittedAt) {
      <app-measurements-display [run]="run"></app-measurements-display>
    } @else {
      <app-measurements-form
        [run]="run"
        [isSubmitting]="isSubmittingMeasurements"
        (submitMeasurements)="onSubmitMeasurements($event)"
      ></app-measurements-form>
    }
  </div>
</div>
